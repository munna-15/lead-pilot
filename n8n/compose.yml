services:
  n8n:
    image: n8nio/n8n:latest
    container_name: leadpilot-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Dhaka
      - TZ=Asia/Dhaka
      - N8N_SECURE_COOKIE=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - leadpilot_n8n_data:/home/node/.n8n

volumes:
  leadpilot_n8n_data: